name: CPU packages
on:
  push:
    branches: ["main", "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install standalone packages
        run: |
          python -m pip install '.[test]'
          python -m pip install './packages/bt-agent-robotics[navigation,vision]'
          python -m pip check
      - name: Core tests and CPU example
        run: |
          python -m pytest -q --junitxml=artifacts/core-tests.xml
          python -I examples/cpu_demo.py
      - name: Robot skills with fake backends
        working-directory: packages/bt-agent-robotics
        run: python -m pytest -q --junitxml=../../artifacts/robotics-tests.xml
      - name: Combined test collection and coverage
        run: python -m pytest -q tests packages/bt-agent-robotics/tests --junitxml=artifacts/combined-tests.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cpu-tests-${{ matrix.python }}
          path: artifacts/*tests.xml
          retention-days: 14
