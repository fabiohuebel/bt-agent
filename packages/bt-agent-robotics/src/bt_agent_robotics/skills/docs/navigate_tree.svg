<svg xmlns="http://www.w3.org/2000/svg" width="980" height="900" viewBox="0 0 980 900" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="900" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#111">NAVIGATE skill — behavior tree and recovery semantics (as built)</text>
  <text x="24" y="54" font-size="12" fill="#555">source: bt_skills/navigate.py · constants: _MAX_REPLAN_ATTEMPTS=3 · _NO_PROGRESS_EPS_M=0.05 · _NO_PROGRESS_WINDOW_S=5.0 · _POSE_STALENESS_S=1.0</text>

  <!-- Safeguard wrap -->
  <rect x="24" y="76" width="932" height="118" rx="8" fill="#f4f6fa" stroke="#334" stroke-width="1.5"/>
  <text x="40" y="98" font-size="13" font-weight="bold" fill="#334">Safeguard wrap — Sequence(memory=False): all three guards re-tick EVERY cycle before the body</text>
  <rect x="40" y="110" width="200" height="66" rx="5" fill="#fff" stroke="#666"/>
  <text x="52" y="130" font-size="12" font-weight="bold" fill="#222">CancellationGuard</text>
  <text x="52" y="147" font-size="11" fill="#555">handle + blackboard cancel;</text>
  <text x="52" y="161" font-size="11" fill="#555">preemption ≈ one tick</text>
  <rect x="256" y="110" width="200" height="66" rx="5" fill="#fff" stroke="#666"/>
  <text x="268" y="130" font-size="12" font-weight="bold" fill="#222">WallTimeBudgetGuard</text>
  <text x="268" y="147" font-size="11" fill="#555">120 s generic backstop</text>
  <text x="268" y="161" font-size="11" fill="#555">(recovery fails typed long before)</text>
  <rect x="472" y="110" width="460" height="66" rx="5" fill="#fff" stroke="#334" stroke-width="1.5"/>
  <text x="484" y="130" font-size="12" font-weight="bold" fill="#222">InvariantGuard — safeguard_invariant φ_σ</text>
  <text x="484" y="147" font-size="11" fill="#555">fails the skill when: pose is None · planned path present-but-empty ·</text>
  <text x="484" y="161" font-size="11" fill="#333"><tspan font-weight="bold">pose stamp older than _POSE_STALENESS_S</tspan> (no stamp available ⇒ check disabled, logged once)</text>

  <!-- Body -->
  <line x1="490" y1="194" x2="490" y2="214" stroke="#334" stroke-width="1.5"/>
  <rect x="24" y="214" width="932" height="50" rx="8" fill="#f4f6fa" stroke="#334" stroke-width="1.5"/>
  <text x="40" y="236" font-size="13" font-weight="bold" fill="#334">Body — Selector(memory=True)</text>
  <text x="40" y="253" font-size="11" fill="#555">shortcut first; refuses the shortcut on a stale pose</text>

  <line x1="160" y1="264" x2="160" y2="288" stroke="#334" stroke-width="1.5"/>
  <line x1="600" y1="264" x2="600" y2="288" stroke="#334" stroke-width="1.5"/>

  <rect x="60" y="288" width="220" height="56" rx="6" fill="#fff" stroke="#666"/>
  <text x="74" y="308" font-size="12" font-weight="bold" fill="#222">_CheckAlreadyAtGoal</text>
  <text x="74" y="324" font-size="11" fill="#555">within 0.4 m ⇒ SUCCESS, skip drive</text>
  <text x="74" y="338" font-size="11" fill="#555">stale pose ⇒ does not apply</text>

  <rect x="320" y="288" width="560" height="56" rx="6" fill="#fff" stroke="#334"/>
  <text x="334" y="308" font-size="12" font-weight="bold" fill="#222">Sequence: plan_and_execute (memory=True)</text>
  <text x="334" y="326" font-size="11" fill="#555">_ValidateGoal (finite coords → failed_invalid) → _PlanPath (≥1 waypoint → failed_no_path) → _FollowPath → _ConfirmArrival</text>

  <!-- Recovery state machine -->
  <rect x="24" y="376" width="932" height="256" rx="8" fill="#fbf7ef" stroke="#8a6d1a" stroke-width="1.5"/>
  <text x="40" y="400" font-size="13" font-weight="bold" fill="#5c470f">_FollowPath — stuck-recovery loop (the part that used to be fictional; now real and progress-gated)</text>

  <rect x="40" y="416" width="240" height="70" rx="6" fill="#fff" stroke="#8a6d1a"/>
  <text x="52" y="436" font-size="12" font-weight="bold" fill="#222">stuck trigger (either)</text>
  <text x="52" y="453" font-size="11" fill="#555">· 10 s waypoint timeout</text>
  <text x="52" y="468" font-size="11" fill="#555">· no-progress: &lt; 0.05 m improvement</text>
  <text x="52" y="481" font-size="11" fill="#555">  toward waypoint over 5.0 s</text>

  <text x="292" y="452" font-size="16" fill="#8a6d1a" font-weight="bold">→</text>
  <rect x="316" y="416" width="200" height="70" rx="6" fill="#fff" stroke="#8a6d1a"/>
  <text x="328" y="436" font-size="12" font-weight="bold" fill="#222">on entry, always:</text>
  <text x="328" y="453" font-size="11" fill="#555">reset waypoint timer +</text>
  <text x="328" y="468" font-size="11" fill="#555">progress tracker ⇒ attempts</text>
  <text x="328" y="481" font-size="11" fill="#555">accrue at ≥ trigger cadence</text>

  <text x="528" y="452" font-size="16" fill="#8a6d1a" font-weight="bold">→</text>
  <rect x="552" y="416" width="180" height="70" rx="6" fill="#fff" stroke="#8a6d1a"/>
  <text x="564" y="436" font-size="12" font-weight="bold" fill="#222">replan()</text>
  <text x="564" y="453" font-size="11" fill="#555">backend-agnostic:</text>
  <text x="564" y="468" font-size="11" fill="#555">may return new, identical,</text>
  <text x="564" y="481" font-size="11" fill="#555">or no path</text>

  <rect x="756" y="404" width="188" height="94" rx="6" fill="#eef4ee" stroke="#2a6" stroke-width="1.5"/>
  <text x="768" y="424" font-size="12" font-weight="bold" fill="#14532d">budget reset — ONLY on</text>
  <text x="768" y="441" font-size="11" fill="#333">distance-to-GOAL improved</text>
  <text x="768" y="456" font-size="11" fill="#333">&gt; 0.05 m since last reset</text>
  <text x="768" y="473" font-size="11" fill="#555">path novelty never resets:</text>
  <text x="768" y="488" font-size="11" fill="#555">A↔B ping-pong can't cheat it</text>

  <rect x="40" y="510" width="500" height="104" rx="6" fill="#fff" stroke="#8a6d1a"/>
  <text x="52" y="530" font-size="12" font-weight="bold" fill="#222">attempt accounting (_MAX_REPLAN_ATTEMPTS = 3)</text>
  <text x="52" y="548" font-size="11" fill="#333">· new path adopted, no goal progress ⇒ attempt spent, keep driving</text>
  <text x="52" y="563" font-size="11" fill="#333">· identical path returned ⇒ attempt spent</text>
  <text x="52" y="578" font-size="11" fill="#333">· no path returned ⇒ attempt spent</text>
  <text x="52" y="596" font-size="11" fill="#555">worst case ≈ 3 × trigger window ≈ 30 s to a typed failure — never the 120 s wall guard</text>

  <rect x="564" y="510" width="380" height="104" rx="6" fill="#fdeaea" stroke="#b33" stroke-width="1.5"/>
  <text x="576" y="530" font-size="12" font-weight="bold" fill="#7a1f1f">budget exhausted ⇒ FAILURE, typed:</text>
  <text x="576" y="550" font-size="11" fill="#333">· exhausting replan returned no path ⇒ <tspan font-weight="bold">failed_no_path</tspan></text>
  <text x="576" y="566" font-size="11" fill="#333">· identical/oscillating path ⇒ <tspan font-weight="bold">failed_blocked</tspan></text>
  <text x="576" y="586" font-size="11" fill="#555">terminate() cancels the local planner —</text>
  <text x="576" y="600" font-size="11" fill="#555">the robot physically stops on failure</text>

  <!-- Arrival -->
  <rect x="24" y="644" width="932" height="96" rx="8" fill="#f4f6fa" stroke="#334" stroke-width="1.5"/>
  <text x="40" y="666" font-size="13" font-weight="bold" fill="#334">_ConfirmArrival — honest arrival semantics</text>
  <text x="40" y="686" font-size="11" fill="#333">· within 0.4 m + settled ⇒ <tspan font-weight="bold">arrived</tspan> (arrived ⇒ within threshold, guaranteed)</text>
  <text x="40" y="702" font-size="11" fill="#333">· 15 s settle timeout with movement, beyond 0.4 m ⇒ <tspan font-weight="bold">arrived_short</tspan> + residual_distance_m (downstream capture knows it's off-spot)</text>
  <text x="40" y="718" font-size="11" fill="#333">· stale pose ⇒ never reports arrived (invariant guard terminates the skill) · never moved in 15 s ⇒ <tspan font-weight="bold">failed_no_movement</tspan></text>

  <!-- Typed routing -->
  <rect x="24" y="752" width="932" height="126" rx="8" fill="#eef4ee" stroke="#2a6" stroke-width="2"/>
  <text x="40" y="774" font-size="13" font-weight="bold" fill="#14532d">Typed failure routing — arrival_status survives the skill → planner boundary</text>
  <text x="40" y="792" font-size="11" fill="#333">skill_completed events carry arrival_status; ExecuteSkill appends one deterministic guidance sentence to the observation (code routing, no LLM):</text>
  <text x="56" y="812" font-size="11" fill="#333">failed_no_path → "no route exists — try a different viewpoint or target"</text>
  <text x="56" y="828" font-size="11" fill="#333">failed_blocked → "path blocked after repeated replans — retry later or approach differently"</text>
  <text x="56" y="844" font-size="11" fill="#333">failed_no_movement → "the robot never moved — check the navigation stack"</text>
  <text x="56" y="860" font-size="11" fill="#333">arrived_short → "stopped short of the target — result frames may be off-center"</text>
  <text x="620" y="836" font-size="11" fill="#555">(exact strings: lam_agent/actor.py</text>
  <text x="620" y="851" font-size="11" fill="#555">route_arrival_guidance)</text>
</svg>
