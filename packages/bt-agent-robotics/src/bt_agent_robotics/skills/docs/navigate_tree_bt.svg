<svg xmlns="http://www.w3.org/2000/svg" width="980" height="740" viewBox="0 0 980 740" font-family="Helvetica, Arial, sans-serif">
  <rect width="980" height="740" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">NAVIGATE skill — behavior tree (canonical notation, as built)</text>
  <text x="20" y="49" font-size="11" fill="#555">tick flow: top-down, children left→right · source: bt_skills/navigate.py (wrap auto-applied by the skill framework)</text>

  <!-- legend -->
  <rect x="640" y="12" width="330" height="46" rx="6" fill="#f7f7f7" stroke="#ccc"/>
  <text x="652" y="30" font-size="11" fill="#333">→ Sequence &#160;&#160; ? Fallback/Selector &#160;&#160; (…)* = with memory</text>
  <text x="652" y="47" font-size="11" fill="#333">⬭ condition (guard) &#160;&#160; ▭ action &#160;&#160; dashed = inside the action</text>

  <!-- ROOT: safeguard sequence -->
  <rect x="420" y="70" width="150" height="46" rx="4" fill="#eef1f7" stroke="#334" stroke-width="2"/>
  <text x="495" y="89" font-size="15" font-weight="bold" fill="#334" text-anchor="middle">→</text>
  <text x="495" y="106" font-size="11" fill="#334" text-anchor="middle">safeguard wrap (no memory)</text>
  <text x="495" y="64" font-size="10" fill="#777" text-anchor="middle">re-ticks ALL children every cycle — the reactive layer</text>

  <!-- edges root -> level 2 -->
  <line x1="495" y1="116" x2="130" y2="168" stroke="#666"/>
  <line x1="495" y1="116" x2="330" y2="168" stroke="#666"/>
  <line x1="495" y1="116" x2="540" y2="168" stroke="#666"/>
  <line x1="495" y1="116" x2="790" y2="168" stroke="#666"/>

  <!-- guards -->
  <ellipse cx="130" cy="192" rx="105" ry="26" fill="#fff8f0" stroke="#a60" stroke-width="1.5"/>
  <text x="130" y="188" font-size="12" text-anchor="middle" fill="#222">not cancelled?</text>
  <text x="130" y="203" font-size="10" text-anchor="middle" fill="#777">CancellationGuard</text>

  <ellipse cx="330" cy="192" rx="95" ry="26" fill="#fff8f0" stroke="#a60" stroke-width="1.5"/>
  <text x="330" y="188" font-size="12" text-anchor="middle" fill="#222">wall time &lt; 120 s?</text>
  <text x="330" y="203" font-size="10" text-anchor="middle" fill="#777">WallTimeBudgetGuard</text>

  <ellipse cx="540" cy="192" rx="110" ry="30" fill="#fdeaea" stroke="#b33" stroke-width="2"/>
  <text x="540" y="184" font-size="12" text-anchor="middle" fill="#222">invariant φ_σ holds?</text>
  <text x="540" y="198" font-size="10" text-anchor="middle" fill="#7a1f1f">pose ≠ None · path non-empty ·</text>
  <text x="540" y="210" font-size="10" text-anchor="middle" fill="#7a1f1f" font-weight="bold">pose age ≤ 1.0 s (NEW)</text>

  <!-- body selector -->
  <rect x="720" y="168" width="140" height="48" rx="4" fill="#eef1f7" stroke="#334" stroke-width="2"/>
  <text x="790" y="188" font-size="15" font-weight="bold" fill="#334" text-anchor="middle">?*</text>
  <text x="790" y="206" font-size="11" fill="#334" text-anchor="middle">body (memory)</text>

  <!-- edges selector -> children -->
  <line x1="790" y1="216" x2="620" y2="268" stroke="#666"/>
  <line x1="790" y1="216" x2="850" y2="268" stroke="#666"/>

  <!-- shortcut -->
  <rect x="490" y="268" width="260" height="52" rx="8" fill="#f4faf4" stroke="#2a6" stroke-width="1.5"/>
  <text x="620" y="288" font-size="12" text-anchor="middle" fill="#222">_CheckAlreadyAtGoal</text>
  <text x="620" y="303" font-size="10" text-anchor="middle" fill="#555">within 0.4 m ∧ pose fresh ⇒ SUCCESS (skip drive)</text>
  <text x="620" y="315" font-size="10" text-anchor="middle" fill="#555">else FAILURE ⇒ selector falls through ↓</text>

  <!-- plan_and_execute sequence -->
  <rect x="780" y="268" width="140" height="48" rx="4" fill="#eef1f7" stroke="#334" stroke-width="2"/>
  <text x="850" y="288" font-size="15" font-weight="bold" fill="#334" text-anchor="middle">→*</text>
  <text x="850" y="306" font-size="11" fill="#334" text-anchor="middle">plan_and_execute</text>

  <!-- edges sequence -> 4 actions -->
  <line x1="850" y1="316" x2="220" y2="378" stroke="#666"/>
  <line x1="850" y1="316" x2="440" y2="378" stroke="#666"/>
  <line x1="850" y1="316" x2="660" y2="378" stroke="#666"/>
  <line x1="850" y1="316" x2="870" y2="378" stroke="#666"/>

  <!-- actions row -->
  <rect x="140" y="378" width="160" height="62" rx="6" fill="#fff" stroke="#446" stroke-width="1.5"/>
  <text x="220" y="400" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">_ValidateGoal</text>
  <text x="220" y="416" font-size="10" text-anchor="middle" fill="#555">coords finite?</text>
  <text x="220" y="430" font-size="10" text-anchor="middle" fill="#966">✗ failed_invalid</text>

  <rect x="360" y="378" width="160" height="62" rx="6" fill="#fff" stroke="#446" stroke-width="1.5"/>
  <text x="440" y="400" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">_PlanPath</text>
  <text x="440" y="416" font-size="10" text-anchor="middle" fill="#555">planner.plan → ≥1 waypoint</text>
  <text x="440" y="430" font-size="10" text-anchor="middle" fill="#966">✗ failed_no_path</text>

  <rect x="580" y="378" width="160" height="62" rx="6" fill="#fff" stroke="#b33" stroke-width="2"/>
  <text x="660" y="400" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">_FollowPath</text>
  <text x="660" y="416" font-size="10" text-anchor="middle" fill="#555">multi-tick RUNNING; drives</text>
  <text x="660" y="430" font-size="10" text-anchor="middle" fill="#966">✗ failed_blocked / failed_no_path</text>

  <rect x="800" y="378" width="160" height="62" rx="6" fill="#fff" stroke="#c80" stroke-width="2"/>
  <text x="880" y="400" font-size="12" text-anchor="middle" font-weight="bold" fill="#222">_ConfirmArrival</text>
  <text x="880" y="416" font-size="10" text-anchor="middle" fill="#555">settle ≤15 s · 0.4 m gate</text>
  <text x="880" y="430" font-size="10" text-anchor="middle" fill="#966">✓ arrived / arrived_short · ✗ failed_no_movement</text>

  <!-- FollowPath internal loop (dashed inset) -->
  <line x1="660" y1="440" x2="490" y2="490" stroke="#b33" stroke-dasharray="5 4"/>
  <rect x="60" y="490" width="860" height="140" rx="8" fill="#fbf7ef" stroke="#8a6d1a" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="76" y="512" font-size="12" font-weight="bold" fill="#5c470f">_FollowPath internal recovery loop (state inside the action, not tree nodes)</text>
  <text x="76" y="534" font-size="11" fill="#333">stuck? (10 s waypoint timeout OR &lt;0.05 m progress over 5 s)</text>
  <text x="76" y="552" font-size="11" fill="#333">&#160;&#160;→ reset timer+tracker (always) → replan()</text>
  <text x="76" y="570" font-size="11" fill="#333">&#160;&#160;→ attempt spent if: same path · no path · new path w/o goal progress</text>
  <text x="76" y="588" font-size="11" fill="#333">&#160;&#160;→ budget (3) resets ONLY on &gt;0.05 m distance-to-goal progress since last reset</text>
  <text x="76" y="606" font-size="11" fill="#7a1f1f" font-weight="bold">&#160;&#160;→ exhausted ⇒ FAILURE: failed_no_path (no path) / failed_blocked (stuck with path)</text>
  <text x="76" y="624" font-size="10" fill="#777">terminate() on any exit cancels the local planner — the robot physically stops</text>

  <!-- semantics footer -->
  <rect x="60" y="648" width="860" height="76" rx="8" fill="#eef4ee" stroke="#2a6" stroke-width="1.5"/>
  <text x="76" y="668" font-size="11" fill="#14532d" font-weight="bold">Tick semantics that make this reactive:</text>
  <text x="76" y="686" font-size="11" fill="#333">the wrap has NO memory ⇒ all three guards re-evaluate on EVERY tick even while _FollowPath is RUNNING — a stale pose or cancel aborts mid-drive in ~1 tick.</text>
  <text x="76" y="702" font-size="11" fill="#333">body/plan_and_execute HAVE memory ⇒ they resume at the running child instead of replanning from scratch each tick.</text>
  <text x="76" y="718" font-size="11" fill="#333">Every FAILURE carries a typed arrival_status → ExecuteSkill appends deterministic guidance for the planner (code routing, no LLM).</text>
</svg>
