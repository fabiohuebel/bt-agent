[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt-agent"
version = "0.1.0rc1"
license = {text = "Apache-2.0 for project-authored software and documentation; see LICENSE-SCOPE.md for third-party and data exclusions."}
classifiers = ["Private :: Do Not Upload"]
description = "Behavior-tree skill orchestration for language-model agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["py_trees>=2.2,<3", "requests>=2.28,<3", "numpy>=1.24,<3", "PyYAML>=6,<7", "pydantic>=2,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "packages/bt-agent/src"}

[tool.setuptools.packages.find]
where = ["packages/bt-agent/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "/(_engine|reference)/|packages/bt-agent-robotics/src/bt_agent_robotics/skills/"
